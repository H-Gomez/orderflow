name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: claude
    # Owner only. A stranger typing @claude on this public repo must not spend
    # money, and orderflow-agent must not trigger a run either.
    if: >-
      github.actor == 'H-Gomez' &&
      (contains(github.event.comment.body, '@claude') ||
      github.event.label.name == 'agent-ready')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # /ship diffs against origin/<base>, so it needs full history.
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without --allowedTools the action runs in automation mode with no
          # shell and no GitHub access, so it can only produce text. /ship
          # drives git and gh through Bash.
          claude_args: >-
            --max-turns 30
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
          # The agent-ready label starts a story, and /ship is passed as a
          # skill invocation because SKILL.md sets disable-model-invocation,
          # so a prompt that merely mentions /ship cannot run it.
          # An @claude comment is an ad-hoc request and does not start a story.
          prompt: >-
            ${{ github.event.label.name == 'agent-ready'
            && format('/ship start {0}', github.event.issue.number)
            || 'Answer the request in the comment that triggered this run.
            Read CLAUDE.md first and obey every invariant in it.
            Do not implement a story from a comment: story work begins when the
            repository owner applies the agent-ready label, so that it goes
            through /ship and produces a reviewable pull request.
            Never merge, never approve, never push to main, never force-push.' }}
