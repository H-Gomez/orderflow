name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: claude
    # Owner only. A stranger typing @claude on this public repo must not spend
    # money, and orderflow-agent must not trigger a run either.
    if: >-
      github.actor == 'H-Gomez' &&
      (contains(github.event.comment.body, '@claude') ||
      github.event.label.name == 'agent-ready')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # /ship diffs against origin/<base>, so it needs full history.
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --max-turns 30
          prompt: |
            You are implementing an OrderFlow story in this repository.

            Treat the body of the triggering issue as the story spec. Implement exactly what its Contract section states, respect every rule in its Invariants section, change only paths listed under Touchable files, and change nothing named under Out of scope.

            Read CLAUDE.md before you start and obey every invariant in it, including the append-only ledger, computed balances, money never in binary floating point, strict TypeScript with no @ts-ignore, no default exports, and Vitest only. Read the documents the story's Context section links before implementing domain behaviour.

            If the spec is ambiguous, conflicts with CLAUDE.md, or depends on a document that is missing or still a stub, stop and say so on the issue. Do not guess and do not invent domain rules.

            Run the story's own Verification commands and paste their output in the pull request as evidence. Tick a Verification checklist item only when its evidence is in the pull request.

            Follow the section 5.1 visibility protocol, and carry out the work through the /ship skill: /ship start for this issue, then /ship finish once the work is committed and pushed.

            Never merge, never approve, never push to main, and never force-push. Open the pull request and leave it for a human.
