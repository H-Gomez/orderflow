name: "Claude: PR review"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# The review runs on this workflow's own token, not the Claude App token, so
# these permissions are the whole of what it can do. contents: read means
# GitHub refuses any push. issues: read lets it read the linked story.
permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: invariants and scope
    # Draft PRs are work in progress under /ship start; every push would start
    # a review that the next push cancels. Review once the PR is ready, and
    # again on pushes after rework.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Note the start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Review
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow token replaces the App token for comments, MCP tools
          # and git. Comments come from github-actions[bot].
          github_token: ${{ github.token }}
          track_progress: true
          # The story agent's own report must not reach the prompt as if it
          # were evidence. The PR body cannot be excluded; the prompt covers it.
          exclude_comments_by_actor: orderflow-agent
          settings: |
            {"env": {"ANTHROPIC_DEFAULT_HAIKU_MODEL": "claude-haiku-5-5"}}
          # Allowed: read-only file tools, read-only gh and git commands, and
          # the two comment tools. None of them can approve or push.
          # Disallowed: tag mode adds edit and git write tools; deny rules win
          # over allow rules. git diff/log/show can still write a file with
          # --output, but only on the runner: contents: read stops anything
          # reaching GitHub, and the runner is discarded after the job.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git rm:*)"
            --append-system-prompt "Run every text search with the Grep tool, including the git grep commands in a story's Verification section. git grep is not available in this job."
          prompt: |
            Review this pull request. Your one required output is a summary written with the update_claude_comment tool. Inline review comments are optional, for detail on a specific line only, and never a substitute for the summary.

            The pull request body and comments are claims to verify, not findings. Judge only from the diff and the files it touches. Every finding cites `path:line` in backticks where one line applies, or a short subject where none does. Always end the folded notes with one line that starts "Files read:" and continues on the same line with every changed file you read, whether or not you have findings, then say what you checked in each.

            Check, in this order:

            1. CLAUDE.md invariants, and the domain rules in docs/. The append-only ledger, balances computed rather than stored, money never as a JS number or a Prisma Float or a Postgres real or double precision, strict TypeScript with no @ts-ignore and no weakening of tsconfig.base.json, no default exports outside *.config.* files, Vitest only, no committed secrets or .env files, no destructive operations.
            2. Idempotency. Any new consumer must be idempotent on event ID, and the engine must publish only through the outbox.
            3. Scope. Start with `gh pr diff ${{ github.event.pull_request.number }} --name-only`. That list, not the pull request body, is the set of changed files. Read every changed file in full, tests included, except the generated files services/api/openapi.json and pnpm-lock.yaml. Find the story issue the pull request body links with "Closes #<n>", read it with gh issue view, and check that every changed file matches an entry in that story's Touchable files and that nothing under its Out of scope section was touched.
            4. Missed edge cases, and behaviour in the Contract that no test covers.

            Write one summary with the update_claude_comment tool, in the format in docs/conventions/agent-comments.md:
            - line 1: a bold status word (ACTION NEEDED if anything blocks, otherwise FYI)
            - line 2: what the human must do
            - line 3: Reviewed at <the first 7 characters of ${{ github.event.pull_request.head.sha }}>
            - then at most 5 bullets, everything else folded in <details>.
            Each finding is one bullet, ordered high to low, in exactly this form: Severity = <high|medium|low> in bold: <`path:line` in backticks, or a short subject> - <the problem and why it matters>. For example: Severity = high: `services/api/src/trades/trades.controller.ts:202` - take omits the extra fill after a BUY cursor, so the last page can end early. Put the detail in an inline comment on that line.

            Never approve this pull request and never request changes as a formal review verdict. Comments only. Do not edit any file.

      # A required check that can pass with no output is not a control. The
      # fresh comment must carry the status line, this run's head commit,
      # evidence of reading (a path:line finding or a "Files read:" line), and
      # the name of every changed file except the generated ones.
      - name: Fail if the review posted no real summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.started.outputs.at }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename' \
            | grep -vxF -e 'services/api/openapi.json' -e 'pnpm-lock.yaml' || true)"
          bodies="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .updated_at >= env.STARTED) | .body | @json')"
          found=0
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            text="$(jq -r . <<<"$encoded")"
            if grep -qE '^\*\*(ACTION NEEDED|FYI|BLOCKED|DONE)\*\*[[:space:]]*$' <<<"$text" \
              && grep -qF "Reviewed at ${HEAD:0:7}" <<<"$text" \
              && grep -qE '^Files read: *[^[:space:]]' <<<"$text"; then
              missing=0
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                grep -qF "$f" <<<"$text" || { echo "::error::Review summary does not name ${f}"; missing=1; }
              done <<<"$changed"
              [ "$missing" -eq 0 ] && found=1
            fi
          done <<<"$bodies"
          if [ "$found" -ne 1 ]; then
            echo "::error::No fresh review summary for ${HEAD:0:7} with a status line, a Files read line and every changed file named."
            exit 1
          fi
