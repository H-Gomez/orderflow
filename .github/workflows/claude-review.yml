name: "Claude: PR review"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: invariants and scope
    # Draft PRs are work in progress under /ship start; every push would start
    # a review that the next push cancels. Review once the PR is ready, and
    # again on pushes after rework.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Note the start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Review
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          settings: |
            {"env": {"ANTHROPIC_DEFAULT_HAIKU_MODEL": "claude-sonnet-5-5"}}
          # These tools in allowedTools are read-only or grep, or for posting review comments but has no tool with which to approve.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment"
            --append-system-prompt "Run every text search with the Grep tool, including the git grep commands in a story's Verification section. git grep is not available in this job."
          prompt: |
            Review this pull request. Your one required output is a summary written with the update_claude_comment tool. Inline review comments are optional, for detail on a specific line only, and never a substitute for the summary.

            Check, in this order:

            1. CLAUDE.md invariants, and the domain rules in docs/. The append-only ledger, balances computed rather than stored, money never as a JS number or a Prisma Float or a Postgres real or double precision, strict TypeScript with no @ts-ignore and no weakening of tsconfig.base.json, no default exports outside *.config.* files, Vitest only, no committed secrets or .env files, no destructive operations.
            2. Idempotency. Any new consumer must be idempotent on event ID, and the engine must publish only through the outbox.
            3. Scope. Find the story issue the pull request body links with "Closes #<n>", read it, and check that every changed file matches an entry in that story's Touchable files and that nothing under its Out of scope section was touched.
            4. Missed edge cases, and behaviour in the Contract that no test covers.

            Write one summary with the update_claude_comment tool, in the format in docs/conventions/agent-comments.md: line 1 a bold status word (ACTION NEEDED if anything blocks, otherwise FYI), line 2 what the human must do, at most 5 bullets, everything else folded in <details>. Each finding is one line: path:line, severity high/medium/low, problem. Put the detail in an inline comment on that line.

            Never approve this pull request and never request changes as a formal review verdict. Comments only. A bot approval would satisfy the ruleset's review requirement and silently end human-only merge. Do not push commits, and do not edit any file.

      # A required check that can pass with no output is not a control.
      - name: Fail if the review posted no summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.started.outputs.at }}
        run: |
          set -euo pipefail
          bodies="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '.[] | select(.user.login == "claude[bot]" and .updated_at >= env.STARTED) | .body')"
          if ! grep -qE '^\*\*(ACTION NEEDED|FYI|BLOCKED|DONE)\*\*[[:space:]]*$' <<<"$bodies"; then
            echo "::error::The review ran but posted no fresh summary in the agent-comments format."
            exit 1
          fi
