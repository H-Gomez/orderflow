name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Review
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Every pull request this pipeline produces is authored by the Claude
          # GitHub App, and the action rejects bot actors by default, so without
          # this the review never runs on the pull requests it exists to review.
          # Named, not "*": on a public repo "*" would let any bot start a run.
          # This job cannot loop: it has contents: read, it cannot push, and its
          # only tool posts an inline comment, none of which is a pull_request
          # event, so nothing it does can trigger another review.
          allowed_bots: "claude"
          # Only the inline-comment tool is allowed, so this job can post
          # review comments but has no tool with which to approve.
          claude_args: >-
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
          prompt: |
            Review this pull request and post your findings as inline review comments on the diff.

            Check, in this order:

            1. CLAUDE.md invariants, and the domain rules in docs/. The append-only ledger, balances computed rather than stored, money never as a JS number or a Prisma Float or a Postgres real or double precision, strict TypeScript with no @ts-ignore and no weakening of tsconfig.base.json, no default exports outside *.config.* files, Vitest only, no committed secrets or .env files, no destructive operations.
            2. Idempotency. Any new consumer must be idempotent on event ID, and the engine must publish only through the outbox.
            3. Scope. Find the story issue the pull request body links with "Closes #<n>", read it, and check that every changed file matches an entry in that story's Touchable files and that nothing under its Out of scope section was touched.
            4. Missed edge cases, and behaviour in the Contract that no test covers.

            State clearly whether each finding is blocking or not, and cite a file and a line for every one.

            Never approve this pull request and never request changes as a formal review verdict. Post comments only. A bot approval would satisfy the ruleset's review requirement and silently end human-only merge. Do not push commits, and do not edit any file.
